name: Integration

on:
  workflow_dispatch:
  pull_request:

jobs:
  integrate:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests and save results
        id: tests
        run: |
          mkdir -p test-results
          PYTHONPATH=. pytest tests/ \
            --capture=tee-sys \
            --cov=src \
            --cov-report=term \
            --cov-report=html \
            --junitxml=test-results/results.xml \
            | tee test-results/results.log

      - name: Comment test results and coverage on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let results = 'No test log found.';
            if (fs.existsSync('test-results/results.log')) {
              results = fs.readFileSync('test-results/results.log', 'utf8');
            }

            const truncated =
              results.length > 65000
                ? results.slice(0, 65000) + '\n...TRUNCATED...'
                : results;

            await github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### 🧪 Test Results with Coverage\n\n\`\`\`\n${truncated}\n\`\`\``
            });